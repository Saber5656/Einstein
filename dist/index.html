<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f0e7">
<title>アインシュタイン — みんなで、べーっ。</title>
<link rel="stylesheet" href="./styles.css?v=20260917-2222">
</head>
<body>
<header class="top"><div><span class="logo">😛</span><strong>アインシュタイン</strong><small>EINSTEIN / PHOTO PLAYGROUND</small></div><span class="badge">端末内で編集</span></header>
<main>
<section class="hero"><p class="eyebrow">A LITTLE LESS SERIOUS.</p><h1>みんなで、<em>べーっ。</em></h1><p>写真を一枚選ぶだけ。見つけた全員の口元に、遊び心を。</p></section>
<section class="app">
  <div class="workspace">
    <input id="file" class="file-input" type="file" accept="image/*">
    <label id="drop" class="drop" for="file" role="button" tabindex="0"><span class="big">📷 → 😛</span><strong>写真を選ぶ</strong><small>JPEG / PNG / WebP / HEIC</small></label>
    <div id="editor" class="editor" hidden>
      <div class="bar"><div><button id="edited" type="button" class="active">編集後</button><button id="original" type="button">元画像</button></div><label class="replace" for="file">別の写真</label></div>
      <div class="canvas-wrap"><canvas id="canvas"></canvas><div id="loading" class="loading" hidden>顔を探しています…</div></div>
      <p id="status" class="status"></p>
    </div>
  </div>
  <aside>
    <h2>べーっ、と遊ぶ</h2>
    <div class="card"><strong id="count">写真を待っています</strong><small>顔向きもブラウザ内で推定します。</small></div>
    <fieldset id="controls" disabled>
      <label>仕上がり<div class="seg"><button type="button" data-style="soft" class="active">ソフト</button><button type="button" data-style="pop">ポップ</button></div></label>
      <label>舌パターン<div class="seg"><button type="button" data-pattern="auto" class="active">自動</button><button type="button" data-pattern="natural">自然</button><button type="button" data-pattern="peko">ペロちゃん</button></div></label>
      <label>舌の大きさ <output id="sizeOut">100%</output><input id="size" type="range" min="50" max="180" value="100"></label>
      <label>舌の長さ <output id="lengthOut">100%</output><input id="length" type="range" min="50" max="180" value="100"></label>
      <button id="add" type="button" class="secondary">見つからない顔を手動で追加</button>
      <button id="clearManual" type="button" class="ghost">手動追加を取り消す</button>
    </fieldset>
    <button id="save" type="button" class="save" disabled>PNGで保存</button>
    <p class="privacy">写真そのものは外部へ送信しません。初回のみ顔検出ライブラリとモデルをCDNから取得します。</p>
  </aside>
</section>
</main>
<footer>EXPERIMENT 001 / v1.5-orientation-tongue</footer>
<script type="module" src="./app.js?v=20260917-2222"></script>
</body>
</html>
